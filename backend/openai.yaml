services:
  webui:
    image: ghcr.io/open-webui/open-webui:main
    ports: ["3000:8080"]
    environment:
      - WEBUI_AUTH=False
    volumes:
      - webui_data:/app/backend/data

  nlp-api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - INTERACTION_MODE=direct-parse
      - FIXTURES_DIR=/app/fixtures
      - CSV_PATH=/logs/transactions.csv
    volumes:
      - ./fixtures:/app/fixtures:ro
      - ./logs:/logs

volumes:
  webui_data: