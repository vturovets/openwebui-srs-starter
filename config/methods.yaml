# Global defaults applied to all methods (can be overridden per-method)
defaults:
  timeout_s: 30
  temperature: 0.0

default: semantic-basic

methods:
  - id: rules-basic
    type: rules                       # rules | llm | hybrid | semantic
    enabled: true
    params:
      dictionary_filename: data/dictionary.csv
      configuration_filename: configs/rules.conf

  - id: semantic-basic
    type: semantic
    enabled: true
    label: Semantic mapping (MiniLM)
    description: Use sentence embeddings and cosine similarity for preference mapping.
    params:
      model_name: ${PREF_EMBED_MODEL_NAME:-all-MiniLM-L6-v2}
      similarity_threshold: ${PREF_EMBED_SIMILARITY_THRESHOLD:-0.35}
      top_k: ${PREF_EMBED_TOP_K:-5}

  - id: hybrid-v1
    type: hybrid
    enabled: true
    strategy: cascade              # cascade | vote | weight
    stages:
      - ref: rules-basic
      - ref: gemini-2.5-flash
    fallback: gemini-2.5-flash

  - id: gemini-2.5-flash
    type: llm
    enabled: true
    provider: google
    model: gemini-2.5-flash
    api_base: ${GOOGLE_API_BASE:-https://generativelanguage.googleapis.com/v1beta}
    api_key_env: GOOGLE_API_KEY    # keep the key in env/.env, not here
    params:
      temperature: 0.1
      max_output_tokens: 1024
      top_p: 0.95
      top_k: 40
