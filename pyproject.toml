[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwebui-srs-starter"
version = "0.1.0"
description = "Starter backend implementing the OpenWebUI SRS pipeline."
authors = [{ name = "OpenWebUI" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "dateparser>=1.1",
    "langdetect>=1.0",
    "httpx>=0.26",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
]

[tool.setuptools.packages.find]
include = ["backend*"]